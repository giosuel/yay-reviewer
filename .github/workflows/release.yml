# Release: the owner pushes an annotated tag, whose message becomes the notes:
#   git fetch origin && git tag -a v1.2.3 origin/main && git push origin v1.2.3
# Tags with a "-" (v1.3.0-rc.1) are pre-releases: no AUR push.
# Dry run: Actions > release > Run workflow. Tests and builds the AUR package from
# the chosen branch and uploads it as an artifact; publishes nothing.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Run unit tests
        run: /usr/bin/python3 -m unittest discover -s tests -v

  # Builds the AUR package (check() runs the tests again). Has no secrets.
  aur-build:
    needs: test
    if: github.ref_type != 'tag' || !contains(github.ref_name, '-')
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed git python

      - uses: actions/checkout@v7

      - name: Fill in version and checksum
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          mkdir out
          cp packaging/aur/yay-reviewer/PKGBUILD out/
          if [ -n "$TAG" ]; then
            version="${TAG#v}"
            url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${TAG}.tar.gz"
            # the archive can 404 for a short while after the tag is pushed
            for i in $(seq 1 30); do curl -sSfL -o src.tar.gz "$url" && break; sleep 10; done
          else
            # dry run: package the checked-out commit
            version="0.0.0"
            git archive --prefix="yay-reviewer-${version}/" -o src.tar.gz HEAD
            cp src.tar.gz "out/yay-reviewer-${version}.tar.gz"
            sed -i 's|^source=.*|source=("$pkgname-$pkgver.tar.gz")|' out/PKGBUILD
          fi
          sum="$(sha256sum src.tar.gz | cut -d' ' -f1)"
          sed -i -e "s/^pkgver=.*/pkgver=${version}/" -e "s/^pkgrel=.*/pkgrel=1/" \
                 -e "s/^sha256sums=.*/sha256sums=('${sum}')/" out/PKGBUILD

      - name: Build and test the package
        run: |
          # makepkg refuses to run as root
          useradd -m builder
          chown -R builder: out
          # --nodeps: yay (a runtime dependency) is itself only in the AUR
          su builder -c 'cd out && makepkg -f --nodeps && makepkg --printsrcinfo > .SRCINFO'

      - uses: actions/upload-artifact@v7
        with:
          name: aur-package
          path: |
            out/PKGBUILD
            out/.SRCINFO
            out/*.pkg.tar.zst
          include-hidden-files: true

  github-release:
    needs: [test, aur-build]
    # also for pre-releases, where aur-build is skipped
    if: >-
      always() && github.ref_type == 'tag' && needs.test.result == 'success' &&
      (needs.aur-build.result == 'success' || needs.aur-build.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # checkout turns annotated tags into lightweight ones; fetch the real tag
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          git tag -l --format='%(contents)' "$TAG" > notes.md
          flags=(--verify-tag --title "$TAG" --notes-file notes.md --generate-notes)
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" "${flags[@]}"

  # Pushes the built PKGBUILD and .SRCINFO to the AUR. The only job that sees the
  # AUR key: it runs no third-party actions and builds nothing.
  aur-publish:
    needs: [aur-build, github-release]
    if: github.ref_type == 'tag' && !contains(github.ref_name, '-')
    runs-on: ubuntu-24.04
    environment: aur
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: aur-package
          path: out

      - name: Set up SSH for the AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          install -dm700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          # pinned host key (SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4)
          echo 'aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN' > ~/.ssh/known_hosts
          printf 'Host aur.archlinux.org\n  User aur\n  IdentityFile ~/.ssh/aur\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n' > ~/.ssh/config

      - name: Push to the AUR
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git clone ssh://aur@aur.archlinux.org/yay-reviewer.git aur
          cp out/PKGBUILD out/.SRCINFO aur/
          cd aur
          git config user.name giosuel
          git config user.email me@giosuel.ch
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "AUR package already up to date"
            exit 0
          fi
          git commit -m "Update to ${TAG#v}"
          git push origin master
